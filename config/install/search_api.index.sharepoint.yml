    dependencies:
      module:
        - sharepoint_media
  field_camera_make:
    label: 'Camera Make'
    datasource_id: 'entity:media'
    property_path: 'field_camera_make'
    type: text
    dependencies:
      module:
        - sharepoint_media
  field_camera_model:
    label: 'Camera Model'
    datasource_id: 'entity:media'
    property_path: 'field_camera_model'
    type: text
    dependencies:
      module:
        - sharepoint_media
  # Video/Audio fields
  field_duration:
    label: 'Duration'
    datasource_id: 'entity:media'
    property_path: 'field_duration'
    type: integer
    dependencies:
      module:
        - sharepoint_media
  field_artist:
    label: 'Artist'
    datasource_id: 'entity:media'
    property_path: 'field_artist'
    type: text
    boost: 2.0
    dependencies:
      module:
        - sharepoint_media
  field_album:
    label: 'Album'
    datasource_id: 'entity:media'
    property_path: 'field_album'
    type: text
