langcode: en
status: true
dependencies:
  module:
    - sharepoint_media
    - search_api
    - media
  config:
    - search_api.server.postgresql_server
id: sharepoint_media
name: 'SharePoint Media Index'
description: 'Search index for SharePoint media entities with enhanced metadata.'
read_only: false
field_settings:
  name:
    label: 'Media Name'
    datasource_id: 'entity:media'
    property_path: name
    type: text
    boost: 3.0
    dependencies:
      module:
        - media
  field_sharepoint_drive_item_id:
    label: 'Drive Item ID'
    datasource_id: 'entity:media'
    property_path: 'field_sharepoint_drive_item_id'
    type: string
    dependencies:
      module:
        - sharepoint_media
  field_mime_type:
    label: 'MIME Type'
    datasource_id: 'entity:media'
    property_path: 'field_mime_type'
    type: string
    dependencies:
      module:
        - sharepoint_media
  field_file_size:
    label: 'File Size'
    datasource_id: 'entity:media'
    property_path: 'field_file_size'
    type: integer
    dependencies:
      module:
        - sharepoint_media
  field_sharepoint_path:
    label: 'SharePoint Path'
    datasource_id: 'entity:media'
    property_path: 'field_sharepoint_path'
    type: text
    boost: 2.0
    dependencies:
      module:
        - sharepoint_media
  field_created_by:
    label: 'Created By'
    datasource_id: 'entity:media'
    property_path: 'field_created_by'
    type: text
    boost: 1.5
    dependencies:
      module:
        - sharepoint_media
  field_created_date:
    label: 'Created Date'
    datasource_id: 'entity:media'
    property_path: 'field_created_date'
    type: date
    dependencies:
      module:
        - sharepoint_media
  field_modified_date:
    label: 'Modified Date'
    datasource_id: 'entity:media'
    property_path: 'field_modified_date'
    type: date
    dependencies:
      module:
        - sharepoint_media
  field_auto_tags:
    label: 'Auto Tags'
    datasource_id: 'entity:media'
    property_path: 'field_auto_tags'
    type: text
    boost: 2.5
    dependencies:
      module:
        - sharepoint_media
  field_tags:
    label: 'Manual Tags'
    datasource_id: 'entity:media'
    property_path: 'field_tags:entity:name'
    type: text
    boost: 3.0
    dependencies:
      module:
        - sharepoint_media
        - taxonomy
  # Image specific fields
  field_image_width:
    label: 'Image Width'
    datasource_id: 'entity:media'
    property_path: 'field_image_width'
