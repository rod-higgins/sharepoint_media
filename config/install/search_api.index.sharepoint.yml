    type: text
    dependencies:
      module:
        - sharepoint_media
  # Processed fields from SharePointMetadataProcessor
  sharepoint_file_type:
    label: 'File Type Category'
    property_path: 'sharepoint_file_type'
    type: string
    dependencies:
      module:
        - sharepoint_media
  sharepoint_extension:
    label: 'File Extension'
    property_path: 'sharepoint_extension'
    type: string
    dependencies:
      module:
        - sharepoint_media
  sharepoint_size_category:
    label: 'Size Category'
    property_path: 'sharepoint_size_category'
    type: string
    dependencies:
      module:
        - sharepoint_media
  sharepoint_resolution:
    label: 'Resolution Category'
    property_path: 'sharepoint_resolution'
