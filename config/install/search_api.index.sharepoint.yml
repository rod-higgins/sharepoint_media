  sharepoint_keywords:
    label: 'Generated Keywords'
    property_path: 'sharepoint_keywords'
    type: text
    boost: 2.0
    dependencies:
      module:
        - sharepoint_media
  sharepoint_technical_specs:
    label: 'Technical Specifications'
    property_path: 'sharepoint_technical_specs'
    type: text
    dependencies:
      module:
        - sharepoint_media
  sharepoint_path_components:
    label: 'Path Components'
    property_path: 'sharepoint_path_components'
    type: text
    boost: 1.5
    dependencies:
      module:
        - sharepoint_media
  sharepoint_quality_score:
    label: 'Quality Score'
    property_path: 'sharepoint_quality_score'
    type: decimal
    dependencies:
      module:
        - sharepoint_media
datasource_settings:
  'entity:media':
    bundles:
      default: false
      selected:
        - sharepoint_file
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url:
    weights:
      preprocess_index: -30
  aggregated_field:
    weights:
      add_properties: 20
  content_access:
    weights:
      preprocess_index: -6
      preprocess_query: -4
  entity_status:
    weights:
      preprocess_index: -10
  rendered_item:
    weights:
      add_properties: 0
      pre_index_save: -10
  sharepoint_metadata:
    weights:
      add_properties: 0
tracker_settings:
  default:
    indexing_order: lifo
options:
  index_directly: true
  cron_limit: 50
server: postgresql_server